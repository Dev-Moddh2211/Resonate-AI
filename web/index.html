<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Loan Voice Assistant</title>
<style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:0 16px;color:#18202a}button{padding:10px 16px;margin:8px 8px 8px 0}button:disabled{opacity:.45}.indicator{display:inline-block;padding:6px 10px;border:1px solid #d9e2ec;border-radius:6px;margin-right:8px;color:#52606d}#status{font-weight:600;padding:12px 0}#transcript{border:1px solid #d9e2ec;border-radius:8px;padding:12px;min-height:80px;max-height:360px;overflow:auto}.message{padding:9px;margin:8px 0;border-radius:8px;white-space:pre-wrap}.you{background:#e7f5ff}.assistant{background:#f1f3f5}.label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em}.fallback{margin-top:16px}</style></head>
<body><h1>Business Loan Voice Assistant</h1><p>Preliminary qualification only—not loan approval.</p><button id="start">Start Call</button><button id="end" disabled>End Call</button><div><span class="indicator" id="callStatus"></span><span class="indicator" id="micStatus"></span></div><div id="status"></div><div id="transcript" aria-live="polite"></div><div class="fallback" id="fallback" hidden><label>Testing fallback <input id="typed"></label><button id="send" disabled>Send</button></div>
<hr><h2>Local realtime evidence demo</h2><p id="demoStatus">Uses actual WAV chunks and local ASR when configured.</p><button id="demoStart">Start WAV replay</button><div id="signals"></div><div id="nudges"></div>
<script>
const API_BASE_URL=(window.__API_BASE_URL__||'').replace(/\/$/,'');
const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition;let callId=null,stream=null,recognition=null,ui='IDLE',ending=false;
function state(s){ui=s;$('callStatus').textContent='Call: '+s;$('start').disabled=!['IDLE','ENDED','ERROR'].includes(s);$('end').disabled=!['REQUESTING_MIC','STARTING','ACTIVE','LISTENING','PROCESSING','SPEAKING','ESCALATING'].includes(s);$('send').disabled=!callId;const msg={IDLE:'Click Start Call to begin.',REQUESTING_MIC:'Requesting microphone access…',STARTING:'Starting conversation…',LISTENING:'● Listening…',ACTIVE:'Call active.',PROCESSING:'Thinking…',SPEAKING:'Speaking…',ENDED:'Call ended.'};$('status').textContent=msg[s]||'An error occurred.';$('micStatus').textContent=s==='LISTENING'?'Microphone: Listening':s==='REQUESTING_MIC'?'Microphone: Checking…':stream?'Microphone: Granted':'Microphone: Released'}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}function add(w,t){const x=document.createElement('div');x.className='message '+(w==='YOU'?'you':'assistant');x.innerHTML='<span class="label">'+w+'</span>'+esc(t);$('transcript').appendChild(x);$('transcript').scrollTop=$('transcript').scrollHeight}
async function api(p,b){const r=await fetch(`${API_BASE_URL}${p}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});if(!r.ok)throw Error();return r.json()}function release(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function fail(text){state('ERROR');$('status').textContent=text;release()}
function speak(t){add('ASSISTANT',t);if(!('speechSynthesis'in window)){listen();return}state('SPEAKING');const u=new SpeechSynthesisUtterance(t);u.onend=()=>{if(callId&&!ending)listen()};u.onerror=u.onend;speechSynthesis.cancel();speechSynthesis.speak(u)}
function listen(){if(!callId||ending)return;if(!recognition){state('ACTIVE');return}try{recognition.start()}catch(e){if(e.name!=='InvalidStateError')fail('Speech recognition could not start.')}}
function setup(){if(!SR){$('fallback').hidden=false;$('status').textContent='Speech recognition is not supported in this browser. Use the testing fallback.';return null}const r=new SR();r.lang='en-IN';r.interimResults=false;r.continuous=false;r.onstart=()=>state('LISTENING');r.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t)send(t)};r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')fail('Microphone or speech permission was denied. Allow access and try again.');else if(e.error!=='aborted')fail('Speech recognition encountered an error.')};r.onend=()=>{if(callId&&!ending&&ui==='LISTENING')state('ACTIVE')};return r}
async function send(t){if(!callId||!t)return;add('YOU',t);state('PROCESSING');try{const o=await api('/api/conversation/turn',{call_id:callId,message:t});if(o.escalated){state('ESCALATING');$('status').textContent='Escalation requested.'}speak(o.response)}catch(e){fail('The assistant is unavailable. Please try again.')}}
$('start').onclick=async()=>{state('REQUESTING_MIC');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('unavailable');stream=await navigator.mediaDevices.getUserMedia({audio:true});$('micStatus').textContent='Microphone: Granted';state('STARTING');const o=await api('/api/conversation/start',{});callId=o.call_id;ending=false;recognition=setup();$('transcript').textContent='';speak(o.response)}catch(e){fail(e.message==='unavailable'?'Microphone is unavailable in this browser.':'Microphone access was denied. Allow microphone access in your browser settings and try again.')}};
let demoTimer; $('demoStart').onclick=async()=>{clearInterval(demoTimer);$('transcript').textContent='';$('signals').textContent='';$('nudges').textContent='';const o=await api('/api/realtime/start',{audio_path:'evidence/category5/audio/compliance.wav',model:'base.en',replay_speed:1});let cursor=0;$('demoStatus').textContent='Replay running…';demoTimer=setInterval(async()=>{const e=await (await fetch(`${API_BASE_URL}/realtime/events?call_id=${o.call_id}&cursor=${cursor}`)).json();cursor=e.cursor;e.events.forEach(x=>{if(x.transcript)add(x.transcript.speaker.toUpperCase(),x.transcript.text);x.signals.forEach(s=>$('signals').innerHTML+='<div>Signal '+esc(s.signal_id)+' ('+s.confidence+')</div>');x.nudges.forEach(n=>$('nudges').innerHTML+='<div><b>'+esc(n.priority)+' nudge</b>: '+esc(n.text)+' @ '+n.timestamp_ms+'ms</div>')});if(e.completed){clearInterval(demoTimer);$('demoStatus').textContent='Replay completed.'}},250)};
$('end').onclick=async()=>{ending=true;if(recognition)recognition.stop();speechSynthesis.cancel();const id=callId;callId=null;recognition=null;release();try{if(id)await api('/api/conversation/end',{call_id:id})}catch(e){$('status').textContent='Call ended, but server cleanup could not be confirmed.'}state('ENDED')};$('send').onclick=()=>{const i=$('typed'),t=i.value.trim();i.value='';send(t)};$('typed').onkeydown=e=>{if(e.key==='Enter')$('send').click()};state('IDLE');
</script></body></html>
