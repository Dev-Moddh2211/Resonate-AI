version: 1
signals:
  - {signal_id: missed_opportunity, category: buying_signal, description: customer mentions expansion or multiple funding needs, examples: ["expanding into another location", "need funding for inventory too"], required_evidence: [expansion, another location, second business, inventory too], confidence_threshold: 0.75, priority: medium, cooldown_seconds: 30, expiry_seconds: 20, deduplication_key: business_opportunity
  - {signal_id: compliance_gap, category: compliance, description: agent implies guaranteed approval or unsupported terms, examples: ["definitely approved", "guaranteed approval"], required_evidence: [definitely approved, guaranteed, guarantee], confidence_threshold: 0.85, priority: high, cooldown_seconds: 10, expiry_seconds: 30, deduplication_key: approval_claim
  - {signal_id: rising_frustration, category: sentiment, description: customer language indicates frustration, examples: ["this is getting frustrating", "already explained"], required_evidence: [frustrating, frustrated, already explained twice, fed up], confidence_threshold: 0.75, priority: high, cooldown_seconds: 30, expiry_seconds: 20, deduplication_key: customer_frustration
  - {signal_id: payment_difficulty, category: repayment, description: customer expresses difficulty managing repayment, examples: ["worried about repayments", "cannot manage the payment"], required_evidence: [worried about repayments, cannot manage, payment is too high, cicilan berat], confidence_threshold: 0.8, priority: high, cooldown_seconds: 30, expiry_seconds: 30, deduplication_key: repayment_concern
  - {signal_id: callback_needed, category: callback, description: customer requests a callback time, examples: ["call me tomorrow afternoon"], required_evidence: [call me, callback, call tomorrow, contact me], confidence_threshold: 0.8, priority: medium, cooldown_seconds: 30, expiry_seconds: 30, deduplication_key: callback_request
